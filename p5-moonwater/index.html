    return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (km) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  if (!subtle) { document.getElementById('err').textContent = 'This browser cannot open private pages.'; return; }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  // Someone who already unlocked one page: open this one straight away, once the gate itself has finished loading
  function auto() {
    subtle.importKey('raw', u8(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(write).catch(function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      document.documentElement.classList.remove('opening');
    });
  }
  if (saved) {
    document.documentElement.classList.add('opening');
    if (document.readyState === 'complete') auto(); else window.addEventListener('load', auto);
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = 'Opening…';
    fromPassword(document.getElementById('pw').value).then(function (k) {
      return decrypt(k).then(function (html) {
        // Remember the key (not the password) so the other private pages open without asking again
        return subtle.exportKey('raw', k).then(function (raw) {
          try { localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (e) {}
          write(html);
        });
      });
    }).catch(function () { btn.disabled = false; err.textContent = 'That password is not right.'; });
  });
})();
</script>
